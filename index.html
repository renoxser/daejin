<style>
    header p {
        color: rgba(255,255,255,0.7); /* 0.55 -> 0.7 로 수정 */
    }
    
    /* 카드 배경 투명도 수정 (가독성) */
    .card {
        background-color: var(--white);
        border-radius: 20px;
        overflow: hidden;
        /* box-shadow 유지 */
    }
</style>

<script>
    // 날짜 인식 정규표현식 강화 (다양한 형식 지원)
    function parseDates(text) {
        // YYYY-MM-DD, YY.MM.DD, MM월 DD일, MM/DD 등 지원
        const datePattern = /(\d{4}-\d{2}-\d{2})|(\d{2}\.\d{2}\.\d{2})|(\d{1,2}월\s?\d{1,2}일)|(\d{1,2}\/\d{1,2})/g;
        return text.match(datePattern);
    }

    // 위험도 계산 로직 수정 (YY.MM.DD 등 지원)
    function getDanger(dateStr) {
        let target;
        const now = new Date();
        const currentYear = now.getFullYear();

        if (/\d{4}-\d{2}-\d{2}/.test(dateStr)) {
            target = new Date(dateStr);
        } else if (/\d{2}\.\d{2}\.\d{2}/.test(dateStr)) {
            const parts = dateStr.split('.');
            target = new Date(`20${parts[0]}-${parts[1]}-${parts[2]}`);
        } else if (/월.*일/.test(dateStr)) {
            const parts = dateStr.replace(/\s/g, '').match(/(\d{2})월(\d{2})일/);
            if (parts) {
                target = new Date(currentYear, parseInt(parts[1]) - 1, parseInt(parts[2]));
            }
        } else if (/\d{1,2}\/\d{1,2}/.test(dateStr)) {
            const parts = dateStr.split('/');
            target = new Date(currentYear, parseInt(parts[0]) - 1, parseInt(parts[1]));
        }

        if (!target || isNaN(target)) return 'safe';

        // 과거 날짜 처리
        if (target < now && Math.ceil((target - now) / (1000 * 60 * 60 * 24)) < -1) return 'safe'; // 이미 지난 과제

        const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
        if (diff <= 2)  return 'urgent';
        if (diff <= 7)  return 'warning';
        return 'safe';
    }

    // 구글 캘린더 링크 생성 함수 추가 (유저에게 실질적 가치 제공)
    function getGoogleCalendarLink(taskIndex, dateStr) {
        const title = encodeURIComponent(`대진대 과제 #${taskIndex}`);
        let datePart = '';
        if (/\d{4}-\d{2}-\d{2}/.test(dateStr)) {
            datePart = dateStr.replace(/-/g, '');
        } else {
            // 다른 형식은 오늘 날짜로 임시 저장 (유저가 직접 수정)
            const now = new Date();
            datePart = now.toISOString().split('T')[0].replace(/-/g, '');
        }
        
        const dates = `${datePart}/${datePart}`; // 하루 종일 이벤트
        return `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=대진대e-Class에서추출됨`;
    }

    // 메인 함수 수정
    function parseDaejinLMS() {
        const rawText = document.getElementById('rawText').value.trim();
        const taskList = document.getElementById('taskList');
        const resultSection = document.getElementById('resultSection');
        const resultCount = document.getElementById('resultCount');

        // 입력 텍스트 검증
        if (!rawText) {
            alert("텍스트를 먼저 붙여넣어 주세요!");
            resetSteps();
            return;
        }

        const foundDates = parseDates(rawText); // 강화된 날짜 파싱

        // 날짜를 찾지 못한 경우 처리
        if (!foundDates || foundDates.length === 0) {
            alert("날짜 형식을 찾지 못했습니다.\n과제 페이지의 내용을 올바르게 복사했는지 확인해주세요!");
            taskList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❓</div>
                    <p>날짜를 인식하지 못했습니다.<br>복사한 내용을 다시 확인하고 붙여넣어 주세요.</p>
                </div>
            `;
            resultCount.textContent = '0';
            resultSection.classList.add('visible');
            resetSteps();
            return;
        }

        // 스텝 바 업데이트 (날짜를 찾은 경우에만)
        document.getElementById('step2').classList.add('active');

        taskList.innerHTML = "";
        resultCount.textContent = foundDates.length;

        foundDates.forEach((date, index) => {
            const level = getDanger(date);
            const card = document.createElement('div');
            card.className = 'task-card';
            card.style.animationDelay = `${index * 0.07}s`;
            
            // 실제 유용한 정보와 구글 캘린더 등록 버튼 추가
            card.innerHTML = `
                <div class="task-stripe ${level}"></div>
                <div class="task-content">
                    <div class="task-index">과제 #${String(index + 1).padStart(2, '0')}</div>
                    <div class="task-date">🗓 ${date}</div>
                    <div class="task-sub">아래 버튼을 눌러 캘린더에 등록할 수 있습니다.</div>
                </div>
                <div class="task-badge badge-${level}">${getLabelText(level)}</div>
                <a href="${getGoogleCalendarLink(index + 1, date)}" target="_blank" class="calendar-btn">🗓 캘린더 등록</a>
            `;
            taskList.appendChild(card);
        });

        // 스텝 바 업데이트 (화면에 카드 표시 완료 후)
        setTimeout(() => {
            document.getElementById('step3').classList.add('active');
        }, foundDates.length * 70);

        resultSection.classList.add('visible');

        // 결과 영역으로 부드럽게 스크롤
        setTimeout(() => {
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    // 스텝 초기화 함수 추가
    function resetSteps() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.remove('active');
    }
</script>
